<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Yash Khiste — Robust Autonomy and Control Systems</title>
  <desc id="desc">Professional engineering banner focused on robust autonomy, control systems and model-based development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0B2340"/>
      <stop offset="100%" stop-color="#103C5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#2AA7C9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2AA7C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>

  <g opacity="0.85">
    <path d="M880 68L1010 112L1110 62M1010 112L1080 205M880 68L840 182L940 235L1080 205"
          fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="880" cy="68" r="8" fill="#7DD3FC"/>
    <circle cx="1010" cy="112" r="10" fill="#22D3EE"/>
    <circle cx="1110" cy="62" r="7" fill="#A5F3FC"/>
    <circle cx="840" cy="182" r="9" fill="#38BDF8"/>
    <circle cx="940" cy="235" r="8" fill="#67E8F9"/>
    <circle cx="1080" cy="205" r="11" fill="#2DD4BF"/>
    <path d="M855 188C895 150 930 150 970 177C1010 204 1043 204 1080 175"
          fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <text x="66" y="90" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">
      M.SC. EEIT · OVGU
    </text>
    <text x="62" y="150" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="2">
      YASH KHISTE
    </text>
    <text x="66" y="192" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="1">
      ROBUST AUTONOMY · CONTROL · MODEL-BASED DEVELOPMENT
    </text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <rect x="66" y="226" width="156" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.18" stroke="#38BDF8"/>
    <text x="144" y="251" fill="#E0F2FE" text-anchor="middle">ROS 2 · MOVEIT 2</text>

    <rect x="238" y="226" width="174" height="38" rx="19" fill="#14B8A6" fill-opacity="0.16" stroke="#2DD4BF"/>
    <text x="325" y="251" fill="#CCFBF1" text-anchor="middle">MATLAB · SIMULINK</text>

    <rect x="428" y="226" width="160" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.18" stroke="#38BDF8"/>
    <text x="508" y="251" fill="#E0F2FE" text-anchor="middle">STATE ESTIMATION</text>

    <rect x="604" y="226" width="212" height="38" rx="19" fill="#14B8A6" fill-opacity="0.16" stroke="#2DD4BF"/>
    <text x="710" y="251" fill="#CCFBF1" text-anchor="middle">VERIFICATION &amp; VALIDATION</text>
  </g>
</svg>
